services:
  db:
    image: postgres:16
    container_name: todoai-db
    environment:
      POSTGRES_DB: ai_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - todoai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_database"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build:
      context: ../ai-service
      dockerfile: docker/Dockerfile
      target: production
    image: todoai-ai-service
    container_name: todoai-ai-service
    env_file:
      - ../ai-service/.env
    environment:
      ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      RELOAD: false
      WORKERS: 1
    ports:
      - "8000:8000"

  mailpit:
    image: axllent/mailpit:latest
    container_name: todoai-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: todoai
    container_name: todoai-api
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Default: ${CONNECTIONSTRINGS__DEFAULT}
      AuthSettings__SecretKey: ${AUTHSETTINGS__SECRETKEY}
      AuthSettings__AccessTokenLifetime: ${AUTHSETTINGS__ACCESSTOKENLIFETIME}
      AuthSettings__RefreshTokenLifetime: ${AUTHSETTINGS__REFRESHTOKENLIFETIME}
      ASPNETCORE_URLS: "http://+:5114"
      ASPNETCORE_ENVIRONMENT: "Development"
      AiService__Enabled: "true"
      AiService__BaseUrl: "http://ai-service:8000"
      AiService__GenerateSchedulePath: "/api/v1/ai/schedule/generate"
      AiService__GenerateMotivationPath: "/api/v1/ai/motivation/generate"
      EmailSettings__Enabled: "true"
      EmailSettings__Provider: "Smtp"
      EmailSettings__Host: "mailpit"
      EmailSettings__Port: "1025"
      EmailSettings__SocketSecurityMode: "None"
      EmailSettings__UserName: ""
      EmailSettings__Password: ""
      EmailSettings__ApiKey: ""
      EmailSettings__FromAddress: "noreply@todoai.local"
      EmailSettings__FromName: "ToDoAI"
    ports:
      - "5114:5114"

volumes:
  todoai_pg:
